<!doctype html>
<html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filmy · demo domácího panelu</title>
<style>
:root{color-scheme:dark;--bg:#080e16;--card:#101d2a;--muted:#adbdca;--accent:#70dbe3;--line:#ffffff20;font:20px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f8fc}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#132738;color:inherit;padding:8px 16px}button:hover{border-color:var(--accent)}button[aria-pressed=true],.primary{background:#163d49;color:#a7f8ff;border-color:#4a929f}header{position:sticky;top:0;z-index:3;padding:12px 20px;background:#080e16f5;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:28px;margin:0 auto 0 0}header small,.muted{color:var(--muted);font-size:20px}.demo{color:#f5ce8a}main{padding:20px}.intro{display:flex;gap:14px;justify-content:space-between;align-items:center;margin-bottom:18px}.intro p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.film{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cover{width:100%;height:190px;display:block;object-fit:cover}.film .body{padding:14px}.film h2{font-size:24px;margin:0 0 10px}.film p{margin:8px 0;font-size:20px}.quality{color:var(--accent)}.open{background:none;padding:0;border:0;text-align:left;width:100%;min-height:0}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;font-size:20px}.notice{padding:12px 16px;border:1px solid #e5bc6244;background:#352a172b;border-radius:10px;line-height:1.5;margin-bottom:18px;font-size:20px}.settings{max-width:960px;margin:auto}.service{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}.service h2{margin:0 0 8px;font-size:26px}.service p{color:var(--muted);line-height:1.5}.service .pair{margin-right:12px}.code{font-size:30px;letter-spacing:5px;padding:16px;background:#080e16;display:block;margin:15px 0}.connected{color:#8ee2ac}.detail-layout{display:grid;grid-template-columns:220px 1fr;gap:24px}.detail-layout .cover{height:310px;border-radius:12px}.detail h2{font-size:32px;margin-top:0}.detail p{line-height:1.6}.detail nav{display:flex;gap:12px;flex-wrap:wrap}.detail table{width:100%;border-collapse:collapse;margin-top:20px}.detail td,.detail th{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:20px}.detail th{color:var(--muted);font-weight:500}.detail .selected{background:#163d4955}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:15px;background:#183647;border:1px solid #5f9da5;border-radius:10px;z-index:8;max-width:90vw}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.toolbar input,.toolbar select{background:var(--card);border:1px solid var(--line);color:inherit;padding:10px;border-radius:10px;min-height:44px;min-width:0}.toolbar input{flex:1}.empty{padding:30px;text-align:center;color:var(--muted)}@media(min-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){header{padding:10px;gap:6px}h1{width:100%;font-size:26px}header button{padding:8px 12px}main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cover{height:145px}.actions{flex-direction:column}.detail-layout{grid-template-columns:1fr}.detail-layout .cover{height:180px}.detail table{display:block;overflow:auto}.intro{align-items:flex-start;flex-direction:column}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
@media(min-width:701px) and (max-width:1100px){.cover{height:125px}.intro{display:none}.notice{padding:10px 14px;margin-bottom:14px}.toolbar{margin-bottom:14px}.film .body{padding:12px}.film h2{font-size:23px}.grid{gap:14px}}
</style>
<header><h1>Filmy <small class="demo">DEMO</small></h1><button data-nav="movies">Nové online</button><button data-nav="saved">Můj výběr</button><button data-nav="settings">Nastavení účtů</button></header><main id="app"></main><script>
const films=[
{id:1,title:'Za hranicí ticha',year:2026,runtime:120,service:'Netflix',genre:'Sci-fi',colors:['#153747','#2996a2'],description:'Posádka vzdálené stanice zachytí zprávu, která přichází z jejich vlastní budoucnosti. Smyšlený film pro ukázku rozhraní.',streams:[{res:2160,hdr:'Dolby Vision',audio:'Dolby Atmos',gb:58},{res:2160,hdr:'Dolby Vision',audio:'Dolby Atmos',gb:28},{res:1080,hdr:'SDR',audio:'DD+ 5.1',gb:9}]},
{id:2,title:'Poslední příliv',year:2026,runtime:110,service:'HBO Max',genre:'Drama',colors:['#122e4d','#246ca3'],description:'Návrat do přístavního města otevírá starý rodinný příběh. Smyšlený film pro ukázku rozhraní.',streams:[{res:2160,hdr:'HDR10',audio:'Dolby Atmos',gb:26},{res:1080,hdr:'SDR',audio:'DD+ 5.1',gb:8}]},
{id:3,title:'Město pod sněhem',year:2026,runtime:100,service:'Prime Video',genre:'Thriller',colors:['#393c59','#8a9cb0'],description:'Detektiv pátrá po zmizelém vlaku v zasněženém městě. Smyšlený film pro ukázku rozhraní.',streams:[{res:2160,hdr:'HDR10+',audio:'TrueHD 7.1',gb:42},{res:1080,hdr:'SDR',audio:'DD+ 5.1',gb:12}]},
{id:4,title:'Ostrov světel',year:2026,runtime:95,service:'Disney+',genre:'Rodinný',colors:['#394345','#dfb266'],description:'Dva sourozenci objeví tajemství majáku a světel na obzoru. Smyšlený film pro ukázku rozhraní.',streams:[{res:2160,hdr:'Dolby Vision',audio:'Dolby Atmos',gb:19},{res:1080,hdr:'SDR',audio:'DD+ 5.1',gb:7}]},
{id:5,title:'Před úsvitem severu',year:2026,runtime:130,service:'SkyShowtime',genre:'Dobrodružný',colors:['#172b3a','#4a8985'],description:'Výprava do severních hor prověří přátelství i odvahu. Smyšlený film pro ukázku rozhraní.',streams:[{res:2160,hdr:'HDR10',audio:'Dolby Atmos',gb:34},{res:1080,hdr:'SDR',audio:'DD+ 5.1',gb:10}]},
{id:6,title:'Všechna naše léta',year:2026,runtime:105,service:'Apple TV',genre:'Komedie',colors:['#51342f','#b97e5c'],description:'Náhodné setkání starých spolužáků změní plán na klidný víkend. Smyšlený film pro ukázku rozhraní.',streams:[{res:2160,hdr:'Dolby Vision',audio:'Dolby Atmos',gb:46},{res:1080,hdr:'SDR',audio:'DD+ 5.1',gb:11}]}];
const app=document.querySelector('#app'),state={view:location.hash==='#settings'?'settings':'movies',selected:null,query:'',service:'',budget:40,saved:new Set(),paired:{rd:false,trakt:false},pairing:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function poster(f){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${f.colors[0]}"/><stop offset="1" stop-color="${f.colors[1]}"/></linearGradient></defs><rect width="480" height="320" fill="url(#g)"/><circle cx="340" cy="95" r="50" fill="#ffffff33"/><path d="M0 280 110 100 250 255 350 170 480 300V320H0" fill="#06141dbb"/><path d="M0 280Q200 230 480 300V320H0" fill="#06141d"/><text x="24" y="39" fill="white" font-size="22" font-family="sans-serif">UKÁZKOVÝ PLAKÁT</text><text x="24" y="293" fill="white" font-size="24" font-family="sans-serif">FILMWATCH / ${f.id.toString().padStart(2,'0')}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function bitrate(f,s){return s.gb*1e9*8/(f.runtime*60)/1e6}function best(f){return f.streams.filter(s=>bitrate(f,s)<=state.budget).sort((a,b)=>b.res-a.res||b.gb-a.gb)[0]}
function qualities(s){return s?`${s.res===2160?'4K':s.res+'p'} · ${s.hdr} · ${s.audio}`:'V limitu nebyl nalezen vhodný stream'}
function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),3500)}
function save(id){if(!state.paired.trakt){state.view='settings';state.selected=null;render();toast('Nejdřív vyzkoušej demo párování Trakt.');return}state.saved.add(id);render();toast('DEMO: film uložen do ukázkového seznamu Trakt. Skutečný účet se nemění.')}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.nav===state.view));if(state.view==='settings'){renderSettings();return}if(state.selected){renderDetail();return}const list=films.filter(f=>(state.view!=='saved'||state.saved.has(f.id))&&f.title.toLocaleLowerCase('cs').includes(state.query.toLocaleLowerCase('cs'))&&(!state.service||f.service===state.service));app.innerHTML=`<div class="intro"><p>Nově online v ČR · nejlepší nalezená kvalita</p><button data-go-settings>50 Mbit/s · limit ${state.budget} Mbit/s</button></div><div class="notice">DEMO · Smyšlené filmy, plakáty a parametry.</div><div class="toolbar"><input id="search" value="${esc(state.query)}" placeholder="Hledat film" aria-label="Hledat film"><select id="service" aria-label="Streamovací služba"><option value="">Všechny služby</option>${[...new Set(films.map(f=>f.service))].map(s=>`<option ${state.service===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="grid">${list.map(f=>{const s=best(f);return `<article class="film"><button class="open" data-open="${f.id}" aria-label="Detail ${esc(f.title)}"><img class="cover" src="${poster(f)}" alt="Ukázkový plakát ${esc(f.title)}"><div class="body"><h2>${esc(f.title)}</h2><p>${f.year} · ${f.service}</p><p class="quality">${qualities(s)}</p><p>${s?s.gb+' GB · ≈ '+bitrate(f,s).toFixed(1)+' Mbit/s':'Zkus upravit limit'}</p></div></button><div class="body actions"><button data-save="${f.id}">${state.saved.has(f.id)?'✓ V seznamu':'+ Trakt'}</button><button data-open="${f.id}">Detail</button></div></article>`}).join('')}</div>${list.length?'':'<p class="empty">V tomto výběru nejsou žádné filmy.</p>'}`;document.querySelector('#search').oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;render();const input=document.querySelector('#search');input.focus();input.setSelectionRange(pos,pos)};document.querySelector('#service').onchange=e=>{state.service=e.target.value;render()};bind()}
function renderDetail(){const f=films.find(f=>f.id===state.selected),s=best(f);app.innerHTML=`<section class="detail"><nav><button data-back>← Zpět na filmy</button><button data-save="${f.id}" class="primary">${state.saved.has(f.id)?'✓ V seznamu Trakt':'+ Uložit do Trakt'}</button></nav><div class="detail-layout" style="margin-top:20px"><img class="cover" src="${poster(f)}" alt="Ukázkový plakát"><div><h2>${esc(f.title)}</h2><p>${f.year} · ${f.genre} · ${f.runtime} min · ${f.service}</p><p>${esc(f.description)}</p><p class="quality">${qualities(s)}</p><p>${s?s.gb+' GB · průměrně ≈ '+bitrate(f,s).toFixed(1)+' Mbit/s':''}</p></div></div><div class="notice">DEMO zdroje · Parametry jsou ukázkové. Průměrný tok z velikosti/délky neříká, jak vysoké budou špičky. Dolby Vision a Atmos musí podporovat i TV a zvuková sestava.</div><table><thead><tr><th>Nalezená varianta</th><th>Velikost</th><th>Tok ≈</th><th>Výběr</th></tr></thead><tbody>${f.streams.map(x=>`<tr class="${x===s?'selected':''}"><td>${qualities(x)}</td><td>${x.gb} GB</td><td>${bitrate(f,x).toFixed(1)} Mbit/s</td><td>${x===s?'Doporučená':bitrate(f,x)>state.budget?'Nad limitem':'Nižší kvalita'}</td></tr>`).join('')}</tbody></table></section>`;bind()}
function renderSettings(){app.innerHTML=`<section class="settings"><h2>Nastavení filmových služeb</h2><div class="notice">DEMO párování je simulované. Nepřihlašuje skutečný účet a nevyžaduje hesla ani API tokeny.</div>${[['rd','Real-Debrid','Hledání zdrojů přes Comet. TV může zůstat vypnutá.'],['trakt','Trakt.tv','Ukládání filmů jedním klepnutím do tvého seznamu.']].map(([id,name,desc])=>`<section class="service"><h2>${name}</h2><p>${desc}</p><p class="${state.paired[id]?'connected':''}">${state.paired[id]?'✓ Spárováno pouze v demu':'Účet není připojený'}</p><button class="pair" data-pair="${id}">${state.paired[id]?'Odpojit demo účet':'Vyzkoušet párování'}</button>${state.pairing===id?`<div><span class="code">DEMO-${id.toUpperCase()}-1234</span><p>V ostré verzi zde bude odkaz a kód poskytovatele pro potvrzení na mobilu.</p><button data-confirm-pair="${id}" class="primary">Simulovat potvrzení účtu</button><button data-cancel-pair>Zrušit</button></div>`:''}</section>`).join('')}<section class="service"><h2>Připojení a výběr kvality</h2><p>Internet: 50 Mbit/s. Výchozí limit průměrného toku 40 Mbit/s nechává rezervu. U dvouhodinového filmu to odpovídá přibližně 36 GB.</p><label>Limit streamu <select id="budget">${[25,30,35,40].map(n=>`<option value="${n}" ${state.budget===n?'selected':''}>${n} Mbit/s</option>`).join('')}</select></label><p>Trakt seznam: <select aria-label="Cílový Trakt seznam"><option>Watchlist · demo</option></select></p></section><section class="service"><h2>Katalog a Comet</h2><p>Streaming Availability API · demo katalog</p><p>Comet na Orange Pi · demo zdroje</p><p>Skutečná propojení a autorizační údaje se nastaví na lokálním backendu. Tato ukázka neodesílá síťové požadavky.</p></section></section>`;document.querySelector('#budget').onchange=e=>{state.budget=Number(e.target.value)};bind()}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.open);render();scrollTo(0,0)});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(Number(b.dataset.save)));document.querySelector('[data-back]')?.addEventListener('click',()=>{state.selected=null;render()});document.querySelector('[data-go-settings]')?.addEventListener('click',()=>{state.view='settings';render()});document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{const id=b.dataset.pair;if(state.paired[id])state.paired[id]=false;else state.pairing=id;render()});document.querySelectorAll('[data-confirm-pair]').forEach(b=>b.onclick=()=>{state.paired[b.dataset.confirmPair]=true;state.pairing=null;render()});document.querySelector('[data-cancel-pair]')?.addEventListener('click',()=>{state.pairing=null;render()})}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.selected=null;state.pairing=null;render();scrollTo(0,0)});render();
</script></html>
